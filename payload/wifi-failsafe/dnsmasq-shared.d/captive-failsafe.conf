# wifi-failsafe captive-portal DNS hijack for NetworkManager shared-mode APs.
#
# Installed to /etc/NetworkManager/dnsmasq-shared.d/captive-failsafe.conf by
# install.sh. NetworkManager's shared-mode dnsmasq reads this dir every time it
# brings up an ipv4.method=shared connection — i.e. the failsafe AP on 10.42.0.1.
#
# Why this file exists: the failsafe AP has NO upstream internet. Without a
# hijack, an OS captive-probe lookup (captive.apple.com, etc.) is forwarded
# upstream, times out, and the phone silently shows "no internet" instead of the
# captive login sheet. Pointing every probe domain at the portal IP makes the
# probe reach Flask (which 302-redirects it), so iOS/Android/Windows/Firefox pop
# the setup portal automatically. Mirrors the proven ap-testbed hijack list.
#
# NOTE: dnsmasq-shared.d applies to ALL NM shared connections. On this box the
# failsafe AP is the only one (ap-testbed runs its own dnsmasq), so there is no
# collision. Keep the domain list in sync with CAPTIVE_HOSTS in wifi-failsafe.py.

address=/captive.apple.com/10.42.0.1
address=/www.apple.com/10.42.0.1
address=/connectivitycheck.gstatic.com/10.42.0.1
address=/connectivitycheck.android.com/10.42.0.1
address=/clients3.google.com/10.42.0.1
address=/clients4.google.com/10.42.0.1
address=/www.msftconnecttest.com/10.42.0.1
address=/www.msftncsi.com/10.42.0.1
address=/dns.msftncsi.com/10.42.0.1
address=/detectportal.firefox.com/10.42.0.1
address=/network-test.debian.org/10.42.0.1
