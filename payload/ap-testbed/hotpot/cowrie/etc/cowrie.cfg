# Cowrie honeypot config for the hot-pot. Medium-interaction fake shell — captures
# creds, commands, and download attempts. JSON logging is what the blue-team
# pipeline (and /hotpot-maintain) reads. Fake identity only; nothing real here.
[honeypot]
hostname = svr-backup01
# accept our weak-cred userdb so a prober "logs in" and we capture their session
auth_class = UserDB
# be forgiving so hands-on-keyboard probers keep going
timeout = 1800

[ssh]
enabled = true
version = SSH-2.0-OpenSSH_8.4p1 Debian-5

[telnet]
enabled = true

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json

[output_textlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.log
