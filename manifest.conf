# manifest.conf — the deployment contract for the pi5-stack payload.
#
# ONE table describing, for every file in payload/: where it lives on a host, who
# owns it, how it is host-rendered, and which hosts get it. Before this file that
# knowledge was encoded three times and differently — layers/30-ap-testbed.sh had an
# --exclude list, layers/70-automation.sh had a sed, and the drift detector had its
# own EXCLUDE_RE plus a placeholder rule. They disagreed, so drift went unnoticed.
#
# Consumed by tools/stack-apply.sh (repo->host), tools/stack-promote.sh (host->repo)
# and tools/stack-drift.sh (compare). Whitespace-delimited, not tab-delimited, so an
# editor that retabs the file cannot silently break the contract.
#
# ---------------------------------------------------------------------------
# @host  LABEL  SSH-TARGET             HOME            USER
# ---------------------------------------------------------------------------
@host    pi     -                      /home/tsoyp     tsoyp
@host    vm     kalivm@100.90.116.22   /home/kalivm    kalivm

# ---------------------------------------------------------------------------
# PATH                          DEST                  OWNER  RENDER    HOSTS  FLAGS
#
# PATH    glob under payload/. '**' matches recursively, '*' never crosses a '/'.
#         The LAST matching rule wins, so the table reads general -> specific ->
#         universal excludes and a later line always overrides an earlier one.
#         A leading '+' marks an ADDITIONAL destination for a file that is already
#         placed by an earlier rule (see the /etc renderings below). Additive rules
#         never win ownership; they only add a second place the file must appear.
# DEST    where it goes. A trailing '/' means a directory and the path under PATH's
#         literal prefix is appended; no trailing slash means that exact filename
#         (which is how a payload file can be installed under a different name).
#         '~' = the host's home. An absolute path is root-owned; apply uses sudo.
#         '-' = never deployed.
# OWNER   repo = repo wins; apply overwrites the host and drift means fix the host.
#         host = runtime state; never copied, never compared, never promoted.
# RENDER  '-'        byte-identical to the repo copy.
#         apdir      __AP_DIR__ / __STACK_USER__ substitution.
#         homeuser   /home/tsoyp and User=/Group= substitution.
# HOSTS   which hosts should carry the file. '-' = none (build-time only).
# FLAGS   'untracked' = also report host files under DEST that the repo has no rule
#         for. Only safe for directories the repo owns exclusively.
# ---------------------------------------------------------------------------

# --- AP testbed: the live captive-portal / deception stack -------------------
# Deployed VERBATIM. The __AP_DIR__/__STACK_USER__ placeholders are NOT rendered
# here — install-testbed.sh renders them downstream into /etc (see the + rules).
# Rendering them in place would corrupt install-testbed.sh itself, whose own source
# contains those strings as sed patterns.
ap-testbed/**                   ~/ap-testbed/         repo   -         pi,vm  untracked
ap-testbed/state/**             -                     host   -         -      -
ap-testbed/logs/**              -                     host   -         -      -
# Bait share + honeytokens are rotated and re-seeded at runtime by hotpot-maintain.
# Comparing them would report the deception layer working as designed as a fault.
ap-testbed/hotpot/smb/share/**  -                     host   -         -      -
ap-testbed/hotpot/tokens/**     -                     host   -         -      -

# --- Second destination: what install-testbed.sh writes into /etc ------------
# These catch a live unit that was hand-edited to debug something and never put
# back. Re-running install-testbed.sh regenerates them, but nothing noticed until
# now that they had diverged.
+ap-testbed/systemd/ap-testbed.target           /etc/systemd/system/          repo -        pi,vm -
+ap-testbed/systemd/ap-testbed-hostapd.service  /etc/systemd/system/          repo -        pi,vm -
+ap-testbed/systemd/ap-testbed-dnsmasq.service  /etc/systemd/system/          repo -        pi,vm -
+ap-testbed/systemd/ap-testbed-net.service      /etc/systemd/system/          repo apdir    pi,vm -
+ap-testbed/systemd/ap-testbed-portal.service   /etc/systemd/system/          repo apdir    pi,vm -
+ap-testbed/systemd/ap-testbed-admin.service    /etc/systemd/system/          repo apdir    pi,vm -
+ap-testbed/udev/99-ap-testbed.rules            /etc/udev/rules.d/            repo -        pi,vm -
+ap-testbed/apt-authorize.sh   /usr/local/sbin/apt-testbed-authorize          repo -        pi,vm -
+ap-testbed/sudoers.d-ap-testbed                /etc/sudoers.d/ap-testbed     repo apdir    pi,vm -

# --- Claude Code operator surface -------------------------------------------
# No untracked flag: the operator legitimately keeps agents and skills here that
# are not part of the rebuild.
agents/*.md                     ~/.claude/agents/     repo   -         pi,vm  -
skills/**                       ~/.claude/skills/     repo   -         pi,vm  -

# --- Scheduled jobs and self-healing ----------------------------------------
stack-cron/*.sh                 ~/stack-cron/         repo   homeuser  pi     -
stack-cron/systemd/*            /etc/systemd/system/  repo   homeuser  pi     -
stack-resilience/*.sh           ~/stack-resilience/   repo   homeuser  pi     -
stack-resilience/*.service      /etc/systemd/system/  repo   homeuser  pi     -
stack-resilience/*.timer        /etc/systemd/system/  repo   homeuser  pi     -

# --- Wi-Fi failsafe (Pi-only: the VM has no built-in radio to fall back to) --
wifi-failsafe/**                ~/wifi-failsafe/      repo   -         pi     -
wifi-failsafe/.state.json       -                     host   -         -      -
+wifi-failsafe/wifi-failsafe.service  /etc/systemd/system/  repo -     pi     -

# --- Bundled MCP server ------------------------------------------------------
greynoise-mcp/**                ~/greynoise-mcp/      repo   -         pi,vm  -

# --- Build-time only: run from the repo, never deployed ----------------------
scripts/**                      -                     repo   -         -      -
claude.json.tmpl                -                     repo   -         -      -
eink-panel/**                   -                     repo   -         -      -

# --- Never compared anywhere -------------------------------------------------
**/__pycache__/**               -                     host   -         -      -
**/*.pyc                        -                     host   -         -      -
**/*.log                        -                     host   -         -      -
**/*.leases                     -                     host   -         -      -
**/venv/**                      -                     host   -         -      -
