# freshness.conf — where each pin in versions.env comes from upstream.
#
# tools/stack-freshness.sh reads this to answer "how far behind is each pin, and is
# any of them now unreachable". Kept as data for the same reason as manifest.conf:
# the alternative is nineteen upstream URLs hardcoded in a script, which is how the
# pins got stale without anyone noticing in the first place.
#
# VAR      the variable in versions.env. '-' for a dependency with no pin at all.
# KIND     gh-commit  | gh-release | pypi | npm | dockerhub | golang | selfupdate
#          | unpinned (a floating dependency — reported so it stays visible)
# SOURCE   OWNER/REPO, package name, or IMAGE:TAG depending on KIND.
#
# VAR                     KIND        SOURCE
# --- toolchains / base ---
GO_VERSION                golang      -
DOCKER_COMPOSE_VERSION    gh-release  docker/compose

# --- C2 ---
SLIVER_VERSION            gh-release  BishopFox/sliver
MYTHIC_VERSION            gh-release  its-a-feature/Mythic  # container-hygiene F2 wants this bumped for mythic_nginx CVEs

# --- phishing infra ---
EVILGINX_COMMIT           gh-commit   kgretzky/evilginx2

# --- hot-pot deception ---
COWRIE_DIGEST             dockerhub   cowrie/cowrie:latest

# --- web-assessment gap fills ---
SSTIMAP_COMMIT            gh-commit   vladko312/SSTImap

# --- analysis / RE helpers ---
GEF_TAG                   gh-release  hugsy/gef
CYBERCHEF_DIGEST          dockerhub   mpepping/cyberchef:latest

# --- sensors ---
# NOTE: tag schemes differ (OISF tags 'suricata-X.Y.Z'; zeek's releases/latest can
# report an LTS lower than a newer feature release). Treat a mismatch as "look at
# this", never as "upgrade automatically".
SURICATA_VERSION          gh-release  OISF/suricata   # tag scheme is suricata-X.Y.Z
ZEEK_VERSION              gh-release  zeek/zeek       # releases/latest may report an LTS BELOW our pin; verify before "upgrading"

# --- core MCP servers ---
HEXSTRIKE_REF             gh-commit   CommonHuman-Lab/hexstrike-ai-community-edition
KALI_MCP_REF              gh-commit   TriV3/MCP-Kali-Server
WSTG_REF                  gh-commit   bhavsec/autopentest-ai
SLIVER_MCP_REF            gh-commit   schwarztim/sec-sliver-c2-mcp
MYTHIC_MCP_REF            gh-commit   nbaertsch/Mythic-MCP
CAIDO_MCP_REF             gh-commit   c0tton-fluff/caido-mcp-server
PENTEST_AI_PIP            pypi        ptai

# --- node / CLI toolchain ---
# NPM_PIN is deliberately held back below latest (node 22 compat) — a mismatch here
# is EXPECTED and is not a finding. See the node-toolchain note before touching it.
NPM_PIN                   npm         npm
CLAUDE_CODE_VERSION       selfupdate  -

# --- floating: no pin at all ---
# Claude Code launches these with `npx -y <pkg>`, which resolves to whatever is
# newest at spawn time. In a repo whose premise is reproducible rebuilds, that is a
# gap: a bad upstream release lands with no review and no rollback.
-                         unpinned    @burtthecoder/mcp-virustotal
-                         unpinned    @playwright/mcp
